<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link rel="icon" type="image/svg-xml" href="icon.svg">
    <link rel="stylesheet" href="styles/style3.css" />
    <div class="nav-bar">
        <a href="index.html"><img src="ascii-logo.png" width="500px" height="auto" class="special"></a>
        <div class="links">
            <a href="logistics.html">Logistics</a>
            <a href="login-portal.html">Login</a>
            <a href="account.html">Account</a>
        </div>
    </div>
</head>
<body>

  <div class="card">
    <h1>Sign-Up</h1>


    <form id="signupForm">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8" />

      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required minlength="8" />

      <button type="submit">Sign Up</button>
    </form>

    <p id="message" class="message"></p>

    <p class="switch-link">Already have an account? <a href="index.html">Log in</a></p>
  </div>

  <script src="signup.js"></script>
</body>
</html>
